extends: "spectral:oas"
rules:
  info-title-required:
    description: "API must have a title"
    severity: error
    given: "$.info"
    then:
      field: title
      function: truthy
  operation-summary-required:
    severity: error
    given: "$.paths[*][*]"
    then:
      field: summary
      function: truthy
  operation-operationId-required:
    severity: error
    given: "$.paths[*][*]"
    then:
      field: operationId
      function: truthy
  operation-summary-apache-prefix:
    description: "Summaries should start with Apache Ozone"
    severity: info
    given: "$.paths[*][get,post,put,delete,patch,head].summary"
    then:
      function: pattern
      functionOptions:
        match: "^Apache Ozone"
  paths-s3-compatible:
    description: "Paths should follow S3 bucket/key pattern"
    severity: info
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^/[{a-z]"
  security-s3-auth:
    description: "S3 API should use AWS Signature authentication"
    severity: warn
    given: "$.info"
    then:
      field: description
      function: truthy
